<!-- MN scene — fixed full-screen backdrop: lake at dawn, state flag,
     loon on the water, cherry branch, ink bottle + quill. aria-hidden:
     purely decorative; every meaning is also in the text. -->
<div class="mn-scene" aria-hidden="true">
    <img class="mn-scene__lake" src="/static/img/mn-lake-sunrise.jpg" alt="">
    <div class="mn-scene__scrim"></div>
    <img class="mn-scene__flag" src="/static/img/mn-flag.png" alt="">
    <img class="mn-scene__cherry" src="/static/img/cherry.jpg" alt="">
    <img class="mn-scene__loon" src="/static/img/loon.png" alt="">
    <svg class="mn-scene__ink" viewBox="0 0 48 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 8c0 0-9 10-9 22a9 9 0 0 0 18 0c0-12-9-22-9-22z"/>

        <rect x="17" y="46" width="14" height="12" rx="2"/>
    </svg>
    <svg class="mn-scene__quill" viewBox="0 0 64 96" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 84C30 62 44 40 50 10c1-5 6-5 6 0 2 22-8 48-24 66-3 3-8 1-8-4 0-3 2-6 6-8z"/>
